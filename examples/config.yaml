# Configuración de ejemplo — copiar al config.yaml del perfil.
#
# No trae valores de ninguna instalación a propósito: cada clave se completa con
# datos que salen de tu proyecto de Infisical. Ver "Configuración" en el README.

plugins:
  enabled:
    - infisical

secrets:
  infisical:
    enabled: true

    # Project Settings -> Project ID
    project_id: "<uuid-del-proyecto>"

    # Environments del proyecto: prod, dev, staging...
    env: prod

    # Carpeta de Secrets que se inyecta COMPLETA (bulk), con barra inicial
    path: /<carpeta-del-proyecto>

    # Opcionales: sólo si hacen falta
    # api_url: https://app.infisical.com    # self-hosted
    # binary_path: ""                        # pin del binario `infisical`
    # cache_ttl_seconds: 300                 # 0 apaga el cache
    # override_existing: true                # pisa .env y shell
