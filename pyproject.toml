[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-infisical-source"
version = "0.1.0"
description = "Infisical secret source plugin for Hermes Agent — resolves provider credentials from an Infisical project folder at startup via Universal Auth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["hermes", "hermes-agent", "infisical", "secrets", "plugin", "secret-source"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
infisical-ls = "hermes_infisical:main_cli"

[tool.setuptools]
py-modules = ["__init__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
