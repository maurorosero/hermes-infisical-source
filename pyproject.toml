[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-infisical-source"
version = "0.1.1"
description = "Infisical secret source plugin for Hermes Agent — resolves provider credentials from an Infisical project folder at startup via Universal Auth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["hermes", "hermes-agent", "infisical", "secrets", "plugin", "secret-source"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
# cli.py importa yaml para leer y escribir config.yaml. Cuando no está declarado,
# el plugin se instala igual y muere al cargar con "No module named yaml": no se
# aplican los secretos de Infisical, el proveedor del modelo se queda sin
# credencial y el error que se ve habla de la API key, no de la dependencia.
# Declararlo hace que pm lo resuelva en el entorno del agente al habilitar el plugin.
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
infisical-ls = "hermes_infisical:main_cli"

[tool.setuptools]
py-modules = ["__init__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
